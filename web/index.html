<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantaden — Asta Fantacalcio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // applica subito il tema salvato (se scelto esplicitamente), prima del
    // primo paint: evita un lampo del tema sbagliato al caricamento
    (function () {
      try {
        var t = localStorage.getItem('fantaden_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage non disponibile: resta il tema di sistema */ }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <h1><img src="logo.png" alt="Fantaden — il rifugio per la tua asta" class="logo-image" id="logoImage"></h1>
      <div class="brand-text">
        <p class="byline">Il rifugio per la tua asta</p>
        <p id="metaInfo" class="meta-info">Caricamento dati…</p>
      </div>
    </div>
    <nav class="topbar-nav">
      <a href="guida.html">📖 Guida</a>
      <a href="https://buymeacoffee.com/danielebaldo" target="_blank" rel="noopener noreferrer">☕ Supportami</a>
    </nav>
  </header>

  <p id="loadError" class="load-error" hidden></p>

  <main>
    <div class="top-row">
      <section class="card setup-panel">
        <div class="setup-row">
          <label class="budget-field">Budget Totale
            <input type="number" id="budgetTotale" min="0">
          </label>
          <div class="cassa-tesoretto">
            <span>Cassa: <strong id="cassaGlobale">—</strong></span>
            <span>Tesoretto: <strong id="tesorettoGlobale">—</strong></span>
          </div>
          <div id="percWarning" class="perc-warning"></div>
        </div>
        <div class="role-setup-grid" id="roleSetupGrid"></div>
      </section>

      <section class="card">
        <h2>Allocazione Budget</h2>
        <div id="waffleBar" class="waffle-bar"></div>
        <section class="monitor-grid" id="monitorGrid"></section>
      </section>
    </div>

    <section class="card" id="planCard">
      <div class="plan-header">
        <h2>📋 Piano d'Asta</h2>
        <button type="button" id="planToggle" class="plan-toggle" title="Collassa/espandi">▼</button>
      </div>
      <div id="planContent"></div>
    </section>

    <section class="card">
      <p id="boardSeasonsNote" class="board-note"></p>
      <div class="tabs" id="roleTabs"></div>
      <div class="table-controls">
        <input type="search" id="searchInput" placeholder="🔍 Cerca giocatore o squadra…">
        <select id="fasciaFilter"></select>
        <label class="checkbox-field"><input type="checkbox" id="onlyAvailable"> Solo disponibili</label>
        <label class="checkbox-field"><input type="checkbox" id="onlyWishlist"> Solo wishlist</label>
        <label class="checkbox-field"><input type="checkbox" id="onlyRigoristi"> 🎯 Solo rigoristi</label>
      </div>
      <div class="table-wrap">
        <table id="playersTable">
          <thead><tr id="playersTableHead"></tr></thead>
          <tbody id="playersTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="tabs" id="rosterTabs"></div>
      <div class="roster-panel" data-roster-panel="mia">
        <div id="myRosterList"></div>
      </div>
      <div class="roster-panel" data-roster-panel="rivali">
        <div class="rival-add">
          <input type="text" id="rivalName" placeholder="Nome rivale">
          <input type="number" id="rivalBudget" placeholder="Budget">
          <button type="button" id="addRivalBtn">+ Aggiungi</button>
        </div>
        <div id="rivalsList"></div>
      </div>
    </section>

    <section class="card">
      <h2>Movimenti quotazioni (ultimi 3 giorni)</h2>
      <div class="two-col" id="movementsPanel"></div>
    </section>
  </main>

  <footer>
    <div class="footer-actions">
      <a href="guida.html" class="link-btn">📖 Guida</a>
      <button type="button" id="exportStateBtn">⬇️ Esporta stato</button>
      <label class="file-btn">⬆️ Importa stato
        <input type="file" id="importStateInput" accept="application/json">
      </label>
      <button type="button" id="resetStateBtn" class="danger">🗑️ Reset totale</button>
      <button type="button" id="themeToggle" class="link-btn" title="Cambia tema chiaro/scuro">🌓 Tema</button>
    </div>
    <p class="credits">
      Fatto da <a href="https://www.instagram.com/dnlbld" target="_blank" rel="noopener noreferrer">Daniele Baldo</a>
      · <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC 4.0</a>
      · <a href="https://buymeacoffee.com/danielebaldo" target="_blank" rel="noopener noreferrer">☕ Offrimi un caffè</a>
    </p>
  </footer>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button type="button" id="modalCancel">Annulla</button>
        <button type="button" id="modalConfirm">Conferma</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
