name: Deploy Dashboard su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/fantacalcio-auction-tool-8ikgz2
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica web/ come artifact di Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
